<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money Buddies">
<title>Money Buddies</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mascots.css">
</head>
<body>
<main id="view" class="view" aria-live="polite"></main>

<button id="fab" class="fab" type="button" aria-label="Add">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-tab="bills">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M13 3l5 5v2"/><path d="M13 3v5h5"/><path d="M8 12h5M8 16h2"/><path d="M21 17.5a3.5 3.5 0 1 1-1-2.5"/><path d="M21 13.5v2.5h-2.5"/></svg>Bills</button>
  <button type="button" data-tab="savings">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 9.5c-.6-1.6-1.6-2.8-3-3.6V3.5l-2.6 1.6A9 9 0 0 0 12 5C7 5 3.5 8 3.5 12c0 2 .9 3.7 2.5 5v3h3v-1.7c1 .3 2 .4 3 .4s2-.1 3-.4V20h3v-3c.9-.7 1.6-1.5 2-2.5h1.5v-5z"/><path d="M10 8.5h3"/><circle cx="16" cy="10.5" r=".6" fill="currentColor"/></svg>Savings</button>
  <button type="button" data-tab="debit">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Debit</button>
  <button type="button" data-tab="summary">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-3M12 16V7M17 16v-6"/></svg>Summary</button>
</nav>

<div id="sheet-wrap" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <form id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate></form>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="mascots.js"></script>
<script src="app.js"></script>
</body>
</html>
